name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Install the production FFmpeg feature set
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg fontconfig fonts-noto-cjk

      - name: Run mock and integration tests
        run: FFMPEG_PATH=/usr/bin/ffmpeg npm test

  docker-build:
    name: Docker deployment build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build the Railway image
        run: docker build --tag postalk-backend:${{ github.sha }} .
