services:
  postalk-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postalk-web
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      GENERATION_WORKER_BASE_URL: http://postalk-web:3000
    command: ["node", "scripts/generation-worker.mjs"]
    depends_on:
      postalk-web:
        condition: service_healthy
    healthcheck:
      disable: true
