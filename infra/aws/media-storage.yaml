AWSTemplateFormatVersion: '2010-09-09'
Description: Private POSTALK media bucket and least-scope runtime policy (no deployment is automatic).
Parameters:
  BucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
    Description: Globally unique S3 bucket name without dots.
  FrontendOrigin:
    Type: String
    Default: https://posttalk.vercel.app
    AllowedPattern: 'https://[a-zA-Z0-9.-]+(:[0-9]+)?'
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag, Content-Length, Content-Type]
            MaxAge: 3600
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  RuntimeMediaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to the API task or instance role; no delete or public ACL permissions.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub '${MediaBucket.Arn}/*'
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt MediaBucket.Arn
Outputs:
  BucketName:
    Value: !Ref MediaBucket
  BucketReference:
    Value: !Sub 's3:${MediaBucket}'
  Region:
    Value: !Ref AWS::Region
  RuntimePolicyArn:
    Value: !Ref RuntimeMediaPolicy
